services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      PAYLOAD_INTERNAL_URL: http://payload:3000
    networks:
      - traefik_bridge
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_bridge"
      - "traefik.http.routers.tech-tres.rule=Host(`next.thetech.com`)"
      - "traefik.http.routers.tech-tres.entrypoints=websecure"
      - "traefik.http.routers.tech-tres.tls.certresolver=leresolver"
      - "traefik.http.services.tech-tres.loadbalancer.server.port=3000"

  payload:
    build:
      context: ./payload
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URI: mongodb://mongo:27017/tech
    depends_on:
      - mongo
    networks:
      - traefik_bridge
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_bridge"
      - "traefik.http.routers.tech-payload.rule=Host(`cms.next.thetech.com`)"
      - "traefik.http.routers.tech-payload.entrypoints=websecure"
      - "traefik.http.routers.tech-payload.tls.certresolver=leresolver"
      - "traefik.http.services.tech-payload.loadbalancer.server.port=3000"

  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--storageEngine", "wiredTiger"]
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

volumes:
  mongo-data:

networks:
  traefik_bridge:
    external: true
  internal:
    internal: true
