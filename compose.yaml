services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      PAYLOAD_INTERNAL_URL: http://payload:3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik_bridge
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_bridge"
      - "traefik.http.routers.tech-tres.rule=Host(`next.thetech.com`)"
      - "traefik.http.routers.tech-tres.entrypoints=websecure"
      - "traefik.http.routers.tech-tres.tls.certresolver=leresolver"
      - "traefik.http.services.tech-tres.loadbalancer.server.port=3000"

  payload:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik_bridge
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_bridge"
      - "traefik.http.routers.tech-payload.rule=Host(`cms.next.thetech.com`)"
      - "traefik.http.routers.tech-payload.entrypoints=websecure"
      - "traefik.http.routers.tech-payload.tls.certresolver=leresolver"
      - "traefik.http.services.tech-payload.loadbalancer.server.port=3000"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: yarn payload migrate
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
volumes:
  postgres-data:

networks:
  traefik_bridge:
    external: true
    name: traefik_bridge
  internal:
    internal: true
