services:
  web:
    build:
      context: ./web
      dockerfile: ./docker/web/Dockerfile
    restart: unless-stopped
    networks:
      - traefik_bridge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_bridge"
      - "traefik.http.routers.tech-tres.rule=Host(`next.thetech.com`)"
      - "traefik.http.routers.tech-tres.entrypoints=websecure"
      - "traefik.http.routers.tech-tres.tls.certresolver=leresolver"
      - "traefik.http.services.tech-tres.loadbalancer.server.port=4321"

networks:
  traefik_bridge:
    external: true
  bridge:
    external: false
